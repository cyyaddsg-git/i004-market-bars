# i004 market API. One free web service; the Pages site stays static.
#
# WEBULL_* are set in the Render dashboard, never here -- this repo is PUBLIC.
# WEBULL_TOOLSETS deliberately OMITS `account`: the host reads prices and must
# not be able to read YY's positions or balance.
services:
  - type: web
    name: i004-market-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r api/requirements.txt
    startCommand: gunicorn --chdir api app:app --bind 0.0.0.0:$PORT --timeout 60 --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # NOT `account`. The host reads prices; it must never be able to read YY's
      # positions or balance, and nothing in api/app.py calls feed.positions().
      - key: WEBULL_TOOLSETS
        value: market-data,instrument
      - key: WEBULL_REGION_ID
        value: sg
      - key: WEBULL_ENVIRONMENT
        value: prod
      # Secrets. Entered in the Render dashboard, NEVER in this file -- the repo is
      # public. Yahoo was tried first and is not viable: it returns 429 to an
      # anonymous request from YY's home address AND from Render's Singapore egress,
      # cookie session and backoff included (measured 2026-09-11). Stooq now serves a
      # proof-of-work bot challenge. Webull is the only source that answers.
      - key: WEBULL_APP_KEY
        sync: false
      - key: WEBULL_APP_SECRET
        sync: false
      # The SDK wants the 2FA token as a FILE; app.py writes it from this value at
      # startup. Optional -- if market-data works on key+secret alone, leave it unset.
      - key: WEBULL_TOKEN
        sync: false
