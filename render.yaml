# i004 market API. One free web service; the Pages site stays static.
#
# WEBULL_* are set in the Render dashboard, never here -- this repo is PUBLIC.
# WEBULL_TOOLSETS deliberately OMITS `account`: the host reads prices and must
# not be able to read YY's positions or balance.
services:
  - type: web
    name: i004-market-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r api/requirements.txt
    startCommand: gunicorn --chdir api app:app --bind 0.0.0.0:$PORT --timeout 60 --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
# NO WEBULL KEYS HERE, AND NONE IN THE DASHBOARD EITHER.
#
# The API tries Webull first and falls through to Yahoo, so with no key present it
# is simply Yahoo-only -- the same source build_horizons.py has used from CI every
# night. That removes the broker credential from a third-party host entirely: there
# is nothing to leak, nothing to rotate, and no account scope to get wrong.
#
# Yahoo rate-limits by IP; it 429s from YY's home address and answers from CI. If it
# ever 429s from Render, the fix is a key in the dashboard as a Secret -- not in this
# file, which is public.
