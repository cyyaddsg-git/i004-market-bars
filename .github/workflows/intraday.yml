name: intraday structure

# On demand only. Prints one symbol's intraday structure to the run log.
# Nothing is published, emailed or committed — this is a read.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "ticker, e.g. NVDA"
        type: string
        default: "NVDA"
      timespan:
        description: "M1 M5 M15 M30 M60"
        type: string
        default: "M5"
      news:
        description: "one-line catalyst (optional)"
        type: string
        default: ""

jobs:
  read:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet webull-openapi-mcp
      - name: restore Webull token
        run: |
          mkdir -p "$RUNNER_TEMP/wb"
          printf '%s' "${{ secrets.WEBULL_TOKEN }}" > "$RUNNER_TEMP/wb/token.txt"
      - name: read intraday structure
        env:
          WEBULL_APP_KEY:    ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_REGION_ID:  sg
          WEBULL_ENVIRONMENT: prod
          WEBULL_TOOLSETS:   market-data,instrument
          WEBULL_TOKEN_DIR:  ${{ runner.temp }}/wb
        run: |
          python engine/intraday.py "${{ inputs.symbol }}" "${{ inputs.timespan }}"
          python engine/intraday.py "${{ inputs.symbol }}" "${{ inputs.timespan }}" --json
          python engine/intraday_card.py "${{ inputs.symbol }}" "${{ inputs.timespan }}" \
                 --news "${{ inputs.news }}" --html docs/intraday.html

      # Its own page, like docs/sim.html — index.html's account-data gate is untouched.
      - name: publish the card
        run: |
          git config user.name  "i004-bot"
          git config user.email "i004-bot@users.noreply.github.com"
          git add docs/intraday.html
          git diff --staged --quiet || git commit -m "intraday: ${{ inputs.symbol }} $(date -u +%H:%MZ)"
          git push
