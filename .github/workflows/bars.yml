name: fetch daily bars
on:
  schedule:
    - cron: "25 21 * * 1-5"      # 21:25 UTC = 17:25 ET, ~1h25m after the US close
  workflow_dispatch:
    inputs:
      range:
        description: "Yahoo range (5d, 3mo, 2y, max)"
        default: "5d"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python fetch.py "${{ inputs.range || '5d' }}"
      - run: |
          git config user.name  "i004-bot"
          git config user.email "i004-bot@users.noreply.github.com"
          git add data/bars.csv
          git diff --staged --quiet || git commit -m "bars: $(date -u +%Y-%m-%d)"
          git push
