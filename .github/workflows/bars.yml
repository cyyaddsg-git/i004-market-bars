name: fetch daily bars
# NO GitHub `schedule:` HERE, deliberately.
#
# GitHub's cron fires for this repo but drifts by HOURS: a 12:45 UTC schedule was
# observed starting at 16:36, 16:42, 16:52, 19:15 and 22:42 UTC on consecutive days.
# The late run then OVERWROTE the on-time dispatch -- which is exactly why the card
# page was last stamped 00:37 SGT instead of the requested hour.
#
# The Claude cloud routine is the only trigger now. Measured 12/12 fires with 4-224s
# drift. Routines: https://claude.ai/code/routines
# This workflow is started by the routine: i004 daily bars — 05:25 SGT
on:
  workflow_dispatch:
    inputs:
      range:
        description: "Yahoo range (5d, 3mo, 2y, max)"
        default: "5d"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python fetch.py "${{ inputs.range || '5d' }}"
      - run: |
          git config user.name  "i004-bot"
          git config user.email "i004-bot@users.noreply.github.com"
          git add data/bars.csv
          git diff --staged --quiet || git commit -m "bars: $(date -u +%Y-%m-%d)"
          git push
