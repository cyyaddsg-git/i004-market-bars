name: daily card

on:
  schedule:
    # YY's requirement (2026-09-05): one prediction pre-market, 09:00 SGT.
    #
    #   01:00 UTC = 09:00 SGT = 21:00 ET the previous day. The US session this
    #   predicts for opens at 21:30 SGT the same evening, so YY reads the card in
    #   the morning and has all day to decide.
    #   Mon-Fri in UTC maps to Mon-Fri sessions.
    #
    # Runs one hour AFTER settle.yml, which is required, not tidy: a prediction
    # lodged against unfilled orders reads the position as flat and buys twice.
    # daily.py --predict settles and fills again itself, as a catch-up.
    #
    # The ET clock is the PREVIOUS day at this hour, so the session date is
    # derived (daily.py next_session), never taken from the clock.
    - cron: "0 1 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "build and print, write nothing and send nothing"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }      # the SDK requires >=3.10,<3.13

      - run: pip install --quiet webull-openapi-mcp

      # The 2FA token is an opaque string and is portable between machines
      # (verified 2026-08-27), so CI never needs an interactive phone approval.
      - name: restore Webull token
        run: |
          mkdir -p "$RUNNER_TEMP/wb"
          printf '%s' "${{ secrets.WEBULL_TOKEN }}" > "$RUNNER_TEMP/wb/token.txt"

      - name: build card, write page, send email
        env:
          WEBULL_APP_KEY:    ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_REGION_ID:  sg
          WEBULL_ENVIRONMENT: prod
          WEBULL_TOOLSETS:   market-data,instrument,account
          WEBULL_TOKEN_DIR:  ${{ runner.temp }}/wb
          SMTP_USER:         genalphai.production@gmail.com
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_TO:         ${{ secrets.REPORT_TO }}
          ACCOUNT_DEPOSITED: ${{ secrets.ACCOUNT_DEPOSITED }}
        run: |
          python engine/daily.py --predict ${{ inputs.dry_run && '--dry-run' || '' }}

      # docs/index.html is PUBLIC. daily.py never writes account data into it;
      # this is the belt-and-braces check, because a leak here is irreversible.
      - name: refuse to publish account data
        env:
          ACCOUNT_DEPOSITED: ${{ secrets.ACCOUNT_DEPOSITED }}
        run: |
          # docs/sim.html is a SIMULATED book, so it legitimately says "equity".
          # It must still never carry the real deposited figure, which is what
          # this second check is for. index.html stays under the strict rule.
          if [ -f docs/sim.html ] && [ -n "$ACCOUNT_DEPOSITED" ] \
             && grep -qF "$ACCOUNT_DEPOSITED" docs/sim.html; then
            echo "::error::the real account figure appears in the simulated page — not publishing"
            exit 1
          fi
          if grep -qiE 'equity|holding|deposited|kill switch|buying power' docs/index.html; then
            echo "::error::account-shaped text found in the public page — not publishing"
            exit 1
          fi

      - name: commit the page
        run: |
          git config user.name  "i004-bot"
          git config user.email "i004-bot@users.noreply.github.com"
          git add docs/index.html docs/sim.html \
                  data/predictions.csv data/orders.csv data/book.json
          git diff --staged --quiet || git commit -m "card: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash -q
          git push
